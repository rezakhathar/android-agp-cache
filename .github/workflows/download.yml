name: Download AGP 9.3.0 Offline

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 9.5.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.5.0-bin.zip
          unzip -q gradle-9.5.0-bin.zip
          chmod +x gradle-9.5.0/bin/gradle

      - name: Show Gradle version
        run: |
          ./gradle-9.5.0/bin/gradle --version

      - name: Resolve AGP 9.3.0
        run: |
          ./gradle-9.5.0/bin/gradle help --refresh-dependencies --stacktrace

      - name: Show resolved Android dependencies
        run: |
          echo "=== AGP ==="
          find ~/.gradle/caches/modules-2/files-2.1/com.android.tools.build \
            -type f 2>/dev/null || true

          echo "=== Android Build API ==="
          find ~/.gradle/caches/modules-2/files-2.1/com.android.build \
            -type f 2>/dev/null || true

      - name: Package Gradle dependency cache
        run: |
          mkdir -p output

          tar -czf output/gradle-modules-cache.tar.gz \
            -C ~/.gradle/caches \
            modules-2

      - name: Upload Gradle dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: gradle-modules-cache
          path: output/gradle-modules-cache.tar.gz
          retention-days: 7
