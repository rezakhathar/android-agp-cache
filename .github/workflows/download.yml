name: Download AGP 9.3.0 Offline

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 9.5.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.5.0-bin.zip
          unzip -q gradle-9.5.0-bin.zip
          chmod +x gradle-9.5.0/bin/gradle

      - name: Show Gradle version
        run: |
          ./gradle-9.5.0/bin/gradle --version

      - name: Resolve AGP and all dependencies
        run: |
          ./gradle-9.5.0/bin/gradle \
            help \
            --refresh-dependencies \
            --stacktrace

      - name: Show AGP dependencies
        run: |
          echo "=== AGP ==="
          find ~/.gradle/caches/modules-2/files-2.1/com.android.tools.build/gradle \
            -type f 2>/dev/null || true

          echo "=== ALL MODULES ==="
          find ~/.gradle/caches/modules-2/files-2.1 \
            -type f 2>/dev/null | wc -l

      - name: Package complete Gradle dependency cache
        run: |
          mkdir -p output

          tar -czf output/agp-9.3.0-full-cache.tar.gz \
            -C ~/.gradle/caches \
            modules-2

          ls -lh output/agp-9.3.0-full-cache.tar.gz

      - name: Upload complete Gradle cache
        uses: actions/upload-artifact@v4
        with:
          name: agp-9.3.0-full-cache
          path: output/agp-9.3.0-full-cache.tar.gz
          retention-days: 7
