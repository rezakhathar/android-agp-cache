name: Download AGP 9.3.0 Offline

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 9.5.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.5.0-bin.zip
          unzip -q gradle-9.5.0-bin.zip

      - name: Resolve AGP and all dependencies
        run: |
          ./gradle-9.5.0/bin/gradle help --refresh-dependencies --stacktrace

      - name: Package ALL Gradle module dependencies
        run: |
          mkdir -p output

          tar -czf output/agp-9.3.0-complete-cache.tar.gz \
            -C ~/.gradle/caches/modules-2 \
            files-2.1

      - name: Show archive size
        run: |
          ls -lh output/agp-9.3.0-complete-cache.tar.gz

      - name: Upload complete cache
        uses: actions/upload-artifact@v4
        with:
          name: agp-9.3.0-complete-cache
          path: output/agp-9.3.0-complete-cache.tar.gz
          retention-days: 7
