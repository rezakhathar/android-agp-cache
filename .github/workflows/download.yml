name: Download AGP 9.3.0 Offline

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Build Android project
        run: |
          ./gradlew :app:assembleDebug \
            --refresh-dependencies \
            --no-daemon \
            --stacktrace

      - name: Package Gradle cache
        run: |
          mkdir -p offline-package

          tar -czf offline-package/gradle-cache.tar.gz \
            -C "$HOME/.gradle" \
            caches

      - name: Upload offline cache
        uses: actions/upload-artifact@v4
        with:
          name: AGP-9.3.0-offline-cache
          path: offline-package/gradle-cache.tar.gz
          retention-days: 7
