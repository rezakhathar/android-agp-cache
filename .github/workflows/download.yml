name: Download AGP 9.3.0 Complete Cache

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 9.5.0
        run: |
          curl -L --fail \
            -o gradle-9.5.0-bin.zip \
            https://services.gradle.org/distributions/gradle-9.5.0-bin.zip

          unzip -q gradle-9.5.0-bin.zip

      - name: Create resolver project
        run: |
          mkdir -p resolver

          cat > resolver/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'resolver'
          EOF

          cat > resolver/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '9.3.0' apply false
          }

          configurations {
              androidDependencies
          }

          dependencies {

              // AAPT2 main artifact
              androidDependencies 'com.android.tools.build:aapt2:9.3.0-15703166'

              // IMPORTANT:
              // Explicitly download the Windows AAPT2 artifact.
              androidDependencies 'com.android.tools.build:aapt2:9.3.0-15703166:windows@jar'

              // AAPT2 proto
              androidDependencies 'com.android.tools.build:aapt2-proto:9.3.0-15703166'

              // Application dependencies
              androidDependencies 'androidx.appcompat:appcompat:1.6.1'
              androidDependencies 'com.google.android.material:material:1.10.0'
              androidDependencies 'androidx.constraintlayout:constraintlayout:2.1.4'
              androidDependencies 'com.squareup.okhttp3:okhttp:4.12.0'
          }

          tasks.register('resolveAll') {
              doLast {
                  configurations.androidDependencies.resolve()
                  println 'Android dependencies resolved.'
              }
          }
          EOF

      - name: Resolve plugin marker and dependencies
        working-directory: resolver
        run: |
          ../gradle-9.5.0/bin/gradle help \
            --refresh-dependencies \
            --no-daemon \
            --stacktrace

          ../gradle-9.5.0/bin/gradle resolveAll \
            --refresh-dependencies \
            --no-daemon \
            --stacktrace

      - name: Verify required artifacts
        run: |
          echo ""
          echo "=============================================="
          echo "ANDROID APPLICATION PLUGIN MARKER"
          echo "=============================================="

          find ~/.gradle/caches/modules-2/files-2.1 \
            -path "*com.android.application*" \
            -type f | sort

          echo ""
          echo "=============================================="
          echo "ANDROID GRADLE PLUGIN 9.3.0"
          echo "=============================================="

          find ~/.gradle/caches/modules-2/files-2.1 \
            -path "*com.android.tools.build/gradle/9.3.0*" \
            -type f | sort

          echo ""
          echo "=============================================="
          echo "AAPT2 9.3.0-15703166"
          echo "=============================================="

          find ~/.gradle/caches/modules-2/files-2.1.0 \
            -path "*com.android.tools.build/aapt2/9.3.0-15703166*" \
            -type f | sort 2>/dev/null || true

          find ~/.gradle/caches/modules-2/files-2.1 \
            -path "*com.android.tools.build/aapt2/9.3.0-15703166*" \
            -type f | sort

          echo ""
          echo "=============================================="
          echo "WINDOWS AAPT2 JAR"
          echo "=============================================="

          find ~/.gradle/caches/modules-2 \
            -type f \
            -name "aapt2-9.3.0-15703166-windows.jar" \
            -print

          echo ""
          echo "=============================================="
          echo "AAPT2 PROTO"
          echo "=============================================="

          find ~/.gradle/caches/modules-2/files-2.1 \
            -path "*com.android.tools.build/aapt2-proto/9.3.0-15703166*" \
            -type f | sort

          echo ""
          echo "=============================================="
          echo "TOTAL CACHE FILES"
          echo "=============================================="

          find ~/.gradle/caches/modules-2 -type f | wc -l

      - name: Check Windows AAPT2 exists
        run: |
          AAPT2_FILE=$(find ~/.gradle/caches/modules-2 \
            -type f \
            -name "aapt2-9.3.0-15703166-windows.jar" \
            | head -n 1)

          if [ -z "$AAPT2_FILE" ]; then
            echo "ERROR: Windows AAPT2 JAR was not downloaded."
            exit 1
          fi

          echo "Windows AAPT2 found:"
          echo "$AAPT2_FILE"

          ls -lh "$AAPT2_FILE"

      - name: Package complete cache
        run: |
          cd ~/.gradle/caches

          tar -czf "$GITHUB_WORKSPACE/agp-9.3.0-complete-cache.tar.gz" \
            modules-2

          ls -lh "$GITHUB_WORKSPACE/agp-9.3.0-complete-cache.tar.gz"

      - name: Upload complete cache
        uses: actions/upload-artifact@v4
        with:
          name: agp-9.3.0-complete-cache
          path: agp-9.3.0-complete-cache.tar.gz
          retention-days: 7
