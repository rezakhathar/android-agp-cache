name: Download Complete AGP 9.3.0 Cache

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 9.5.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.5.0-bin.zip
          unzip -q gradle-9.5.0-bin.zip

      - name: Resolve ALL dependencies
        run: |
          ./gradle-9.5.0/bin/gradle build --refresh-dependencies --stacktrace

      - name: Package COMPLETE Gradle cache
        run: |
          tar -czf agp-9.3.0-complete-cache.tar.gz \
            -C ~/.gradle \
            caches

      - name: Upload COMPLETE cache
        uses: actions/upload-artifact@v4
        with:
          name: agp-9.3.0-complete-cache
          path: agp-9.3.0-complete-cache.tar.gz
          retention-days: 7
