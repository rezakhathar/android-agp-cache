name: Download Full Project Gradle Cache

on:
  workflow_dispatch:

jobs:
  cache:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Download Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-9.5.0-bin.zip
          unzip -q gradle.zip


      - name: Resolve REAL project dependencies
        run: |
          chmod +x gradle-9.5.0/bin/gradle

          ./gradle-9.5.0/bin/gradle \
          build \
          --refresh-dependencies \
          --no-daemon \
          --stacktrace


      - name: Verify Kotlin
        run: |

          find ~/.gradle/caches/modules-2/files-2.1 \
          -name "*kotlin-stdlib-common*" || true


      - name: Package cache
        run: |

          cd ~/.gradle/caches

          tar -czf \
          "$GITHUB_WORKSPACE/full-project-cache.tar.gz" \
          modules-2


      - name: Upload cache
        uses: actions/upload-artifact@v4
        with:

          name: full-project-cache

          path: full-project-cache.tar.gz
